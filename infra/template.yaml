AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: FactLens backend-only HTTP API, Lambda, and DynamoDB stack.

Parameters:
  FactLensStage:
    Type: String
    Default: dev
    AllowedPattern: '^[a-z0-9-]+$'
    Description: Deployment stage suffix for backend resources.
  AnalysesTableName:
    Type: String
    Default: factlens-analyses-dev
    Description: DynamoDB table name exposed to Lambda as ANALYSES_TABLE_NAME.
  FactLensUseFallback:
    Type: String
    Default: 'false'
    AllowedValues:
      - 'true'
      - 'false'
    Description: Sets FACTLENS_USE_FALLBACK for backend RAG fallback behavior.
  FactLensStorageMode:
    Type: String
    Default: dynamodb
    AllowedValues:
      - dynamodb
      - memory
      - local-file
    Description: Sets FACTLENS_STORAGE_MODE for the backend storage adapter.
  MaxClaimsDefault:
    Type: Number
    Default: 10
    MinValue: 1
    MaxValue: 20
    Description: Sets MAX_CLAIMS_DEFAULT for request validation.
  CorsAllowOrigin:
    Type: String
    Default: http://localhost:5173
    Description: Sets CORS_ALLOW_ORIGIN and API Gateway CORS origin.
  EvidenceBucketName:
    Type: String
    Default: factlens-dev-evidence-docs-069423016509-ap-northeast-2
    Description: Current evidence S3 bucket name used by the backend.
  EvidenceCorpusKey:
    Type: String
    Default: source-docs/aws-evidence-corpus.md
    Description: Current evidence corpus object key.
  FallbackEvidenceKey:
    Type: String
    Default: fallback/evidence_docs.json
    Description: Current fallback evidence object key.
  FactLensSearchMode:
    Type: String
    Default: fallback
    AllowedValues:
      - fallback
      - internet
    Description: Sets FACTLENS_SEARCH_MODE. Use internet to enable official-source web search when a search API key is configured.
  FactLensSearchProvider:
    Type: String
    Default: auto
    AllowedValues:
      - auto
      - brave
      - serpapi
      - google_cse
    Description: Sets FACTLENS_SEARCH_PROVIDER for internet evidence search.
  FactLensAllowedSourceDomains:
    Type: String
    Default: docs.aws.amazon.com,aws.amazon.com,repost.aws
    Description: Comma-separated allowed domains for internet evidence results.
  FactLensSearchResultLimit:
    Type: Number
    Default: 3
    MinValue: 1
    MaxValue: 5
    Description: Maximum internet search results to include per claim.

Globals:
  Function:
    Runtime: nodejs20.x
    Architectures:
      - x86_64
    MemorySize: 256
    Timeout: 30
    Tracing: Active
    Environment:
      Variables:
        INPUT_ARCHIVE_BUCKET_NAME: !Ref InputArchiveBucket
        INPUT_ARCHIVE_PREFIX: raw-analyses
        ANALYSES_TABLE_NAME: !Ref AnalysesTable
        FACTLENS_USE_FALLBACK: !Ref FactLensUseFallback
        FACTLENS_STORAGE_MODE: !Ref FactLensStorageMode
        MAX_CLAIMS_DEFAULT: !Ref MaxClaimsDefault
        CORS_ALLOW_ORIGIN: !Ref CorsAllowOrigin
        EVIDENCE_BUCKET_NAME: !Ref EvidenceBucketName
        EVIDENCE_CORPUS_KEY: !Ref EvidenceCorpusKey
        FALLBACK_EVIDENCE_KEY: !Ref FallbackEvidenceKey
        FACTLENS_SEARCH_MODE: !Ref FactLensSearchMode
        FACTLENS_SEARCH_PROVIDER: !Ref FactLensSearchProvider
        FACTLENS_ALLOWED_SOURCE_DOMAINS: !Ref FactLensAllowedSourceDomains
        FACTLENS_SEARCH_RESULT_LIMIT: !Ref FactLensSearchResultLimit
        NODE_OPTIONS: --enable-source-maps

Metadata:
  FactLensEnvironmentContract:
    INPUT_ARCHIVE_BUCKET_NAME: Mapped from the InputArchiveBucket resource.
    INPUT_ARCHIVE_PREFIX: Mapped from inline default.
    AWS_REGION: Provided automatically by the Lambda runtime; do not override the reserved variable.
    ANALYSES_TABLE_NAME: Mapped from the AnalysesTableName parameter.
    FACTLENS_USE_FALLBACK: Mapped from the FactLensUseFallback parameter.
    FACTLENS_STORAGE_MODE: Mapped from the FactLensStorageMode parameter.
    MAX_CLAIMS_DEFAULT: Mapped from the MaxClaimsDefault parameter.
    CORS_ALLOW_ORIGIN: Mapped from the CorsAllowOrigin parameter.
    EVIDENCE_BUCKET_NAME: Mapped from the EvidenceBucketName parameter.
    EVIDENCE_CORPUS_KEY: Mapped from the EvidenceCorpusKey parameter.
    FALLBACK_EVIDENCE_KEY: Mapped from the FallbackEvidenceKey parameter.
    FACTLENS_SEARCH_MODE: Mapped from the FactLensSearchMode parameter.
    FACTLENS_SEARCH_PROVIDER: Mapped from the FactLensSearchProvider parameter.
    FACTLENS_ALLOWED_SOURCE_DOMAINS: Mapped from the FactLensAllowedSourceDomains parameter.
    FACTLENS_SEARCH_RESULT_LIMIT: Mapped from the FactLensSearchResultLimit parameter.

Resources:
  FactLensHttpApi:
    Type: AWS::Serverless::HttpApi
    Properties:
      StageName: $default
      CorsConfiguration:
        AllowOrigins:
          - !Ref CorsAllowOrigin
        AllowHeaders:
          - Content-Type
          - Authorization
          - X-Amz-Date
          - X-Api-Key
          - X-Amz-Security-Token
        AllowMethods:
          - OPTIONS
          - POST
          - GET
        MaxAge: 600

  AnalysesTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Ref AnalysesTableName
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: analysisId
          AttributeType: S
      KeySchema:
        - AttributeName: analysisId
          KeyType: HASH
      SSESpecification:
        SSEEnabled: true
      Tags:
        - Key: Application
          Value: FactLens
        - Key: Component
          Value: Backend
        - Key: Stage
          Value: !Ref FactLensStage

  InputArchiveBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Sub factlens-input-archive-${FactLensStage}-${AWS::AccountId}-${AWS::Region}
      VersioningConfiguration:
        Status: Enabled
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      Tags:
        - Key: Application
          Value: FactLens
        - Key: Component
          Value: Backend
        - Key: Stage
          Value: !Ref FactLensStage

  FactLensBackendFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub factlens-backend-api-${FactLensStage}
      Description: FactLens backend API handler for POST /analyze and GET /analyses/{analysisId}.
      CodeUri: ../backend/
      Handler: src/app.handler
      Events:
        AnalyzeRoute:
          Type: HttpApi
          Properties:
            ApiId: !Ref FactLensHttpApi
            Path: /analyze
            Method: POST
            PayloadFormatVersion: '2.0'
        GetAnalysisRoute:
          Type: HttpApi
          Properties:
            ApiId: !Ref FactLensHttpApi
            Path: /analyses/{analysisId}
            Method: GET
            PayloadFormatVersion: '2.0'
      Policies:
        - Statement:
            - Sid: DynamoDbAnalysisReadWrite
              Effect: Allow
              Action:
                - dynamodb:GetItem
                - dynamodb:PutItem
                - dynamodb:UpdateItem
                - dynamodb:DeleteItem
              Resource: !GetAtt AnalysesTable.Arn
            - Sid: EvidenceObjectRead
              Effect: Allow
              Action:
                - s3:GetObject
              Resource:
                - !Sub arn:${AWS::Partition}:s3:::${EvidenceBucketName}/${EvidenceCorpusKey}
                - !Sub arn:${AWS::Partition}:s3:::${EvidenceBucketName}/${FallbackEvidenceKey}
            - Sid: EvidenceBucketPrefixList
              Effect: Allow
              Action:
                - s3:ListBucket
              Resource: !Sub arn:${AWS::Partition}:s3:::${EvidenceBucketName}
              Condition:
                StringEquals:
                  s3:prefix:
                    - !Ref EvidenceCorpusKey
                    - !Ref FallbackEvidenceKey
            - Sid: InputArchiveWrite
              Effect: Allow
              Action:
                - s3:PutObject
              Resource: !Sub arn:${AWS::Partition}:s3:::${InputArchiveBucket}/*

Outputs:
  ApiEndpoint:
    Description: HTTP API endpoint for backend smoke tests.
    Value: !Sub https://${FactLensHttpApi}.execute-api.${AWS::Region}.${AWS::URLSuffix}
  AnalysesTableName:
    Description: DynamoDB table name used for analysis persistence.
    Value: !Ref AnalysesTable
  InputArchiveBucketName:
    Description: S3 bucket name for storing raw request text.
    Value: !Ref InputArchiveBucket
  BackendFunctionName:
    Description: Lambda function name for the backend API handler.
    Value: !Ref FactLensBackendFunction
  BackendFunctionArn:
    Description: Lambda function ARN for the backend API handler.
    Value: !GetAtt FactLensBackendFunction.Arn
